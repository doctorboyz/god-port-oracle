# farm_variants.yml — SOURCE OF TRUTH สำหรับ paper trade farm (Mac mini, brokerless)
#
# Hermes (scope AI Investor) เสนอ variant ใหม่ = append ลงไฟล์นี้แล้วรัน
#   python3 scripts/paper_farm_apply.py
# ซึ่งจะ regenerate docker-compose.paper-farm.yml และ redeploy
# (DB เดิมคงอยู่, account ใหม่ seed อัตโนมัติผ่าน oracle_runner._seed_portfolio_accounts)
#
# รูปแบบ: ทุก variant = 1 paper account ชื่อ P<digits> (LiveTrader รับ P-name ได้)
# Knob ทุกตัวเป็น env `KNOB_P<digits>` — ดูรายการ knob ทั้งหมดใน
# ψ/memory/learnings/hermes-paper-farm-protocol.md
#
# กติกา farm ทั้งกระบอก (process-global — ใช้ร่วมทุก variant ในก้อนเดียวกัน):
#   TRENDING_HARD_BLOCK=1  → mr-bet MR-only mode (อ่านตอน import, shared ทั้ง process)
#   DRY_RUN=1              → เปิด trade ใน DB แบบ paper ไม่ยิง broker จริง
#   TRADING_PHASE=trade    → ปิด collector (feed มาจาก CSV ไม่ใช่ bridge)
#
# Per-group override: groups.<n>.mode_env เขียนทับ FARM_MODE_ENV รายคีย์
# (ดู _group_mode_env ใน paper_farm_apply.py) — ใช้เมื่อกลุ่มต้องการ process mode
# คนละแบบ ซึ่งต้องเป็น container แยกเพราะ flag อ่านตอน import

# ─── Feed source (paper-fetcher) ──────────────────────────────────────────
# 2026-10-30 (คุณหมอสั่งตรง): paper farm สลับ feed เป็น Exness XAUUSD realtime
# ผ่าน bridge บน VPS (Tailscale) — ราคาเดียวกับ demo B/C/D เป๊ะ เพื่อให้
# เทียบ per-signal ได้จริง (gap ที่เหลือ = execution costs ล้วน)
# 2026-10-30 (ชั่วโมงเดียวกัน — race fix): ชี้ mt5q แทน mt5b — fetcher กับ
# demo engine B เคยใช้ terminal ร่วมกัน: engine shutdown ทุก cycle ทำให้ fetcher
# ตาบอดเป็นช่วง (heal วน 12 ครั้ง/3 ชม. แท่งหายเป็นพักๆ) — mt5q = ราคาอย่างเดียว
# login demo B, mt5b คืนให้ engine B · (หมายเหตุ: stream-closed ใน log engine เป็น
# baseline ของ engine เอง B=C=D เท่ากันเป๊ะ — ไม่ใช่ผลจาก fetcher, ดู retro
# mt5q-dedicated-bridge)
# สลับกลับ: source: yfinance (fetcher จะ era-switch history ให้เอง — ห้าม
# mix สอง feed ใน history เดียว)
feed:
  source: bridge
  bridge_host: vpsdeluna      # tailnet MagicDNS ของ VPS (mt5q: 5012→8001)
  bridge_port: "5012"
  poll_interval: "60"         # วินาที — realtime ต้องเร็วกว่า cycle engine (300s)

common:
  # applied to every variant unless overridden in variants.<name>.env
  INITIAL_BALANCE: "100"
  INITIAL_EQUITY: "100"
  LEVERAGE: "2000"
  ACCOUNT_TYPE: "demo"
  SIGNAL_GROUP: "portfolio"   # must be a valid SignalGroup enum — "farm" breaks
                              # get_bridge_config → every cycle "no candle data"
  RISK_PER_TRADE: "0.005"
  MAX_POSITIONS: "1"
  MAX_POSITIONS_CAP: "1"
  MIN_POSITIONS: "1"
  ATR_MULTIPLIER: "2.0"
  MIN_CONFIDENCE: "0.55"
  BUY_MIN_CONFIDENCE: "0.55"
  SWING_MAX_SPREAD: "30"
  MR_COST_MULT: "3.0"
  SL_CAP: "12.0"
  TIME_STOP_BARS: "12"
  TRAILING_TP_ENABLED: "0"
  CIRCUIT_BREAKER_COOLDOWN_MINUTES: "1440"
  ENTRY_HOURS: "6,8,18,19,20"
  BLOCKED_HOURS: "3,4,5,9,14"

groups:
  - name: farm1
    # แกนที่ 1: MR-only (mr-bet BCD) — TRENDING_HARD_BLOCK=1 process-global
    # ก้อนละ ≤25 variants — RAM ~500MB base + ~10-30MB/variant (วัดจริงก่อนขยาย)
    variants: [P11, P12, P13, P14, P15, P16, P17, P18, P19, P20, P21, P22, P23, P24]
    db_path: /app/data/farm1.db
  - name: farm2
    # แกนที่ 2: trend-following (2026-10-24, axis2) — TRENDING_HARD_BLOCK=0
    # เปิด trend path ของ generator: trending จะมีสัญญาณ swing ตามโค้ดเดิมก่อน
    # mr-bet กฎ counter-trend/trend filter ทำงานตามโค้ดเดิมทั้งหมด (flag อ่านตอน
    # import → ต้องเป็น container แยก = oracle-engine-farm2)
    variants: [P31, P32, P33, P34, P35]
    db_path: /app/data/farm2.db
    mode_env:
      TRENDING_HARD_BLOCK: "0"

variants:
  # ── Base clones: B/C/D ตัวจริงบน VPS (มาตรฐานเทียบ) ──
  P11:
    note: "clone-B — RR 0.80 / Boll 0.70 (มาตรฐานเทียบผลเทียบ VPS B)"
    env:
      RR_RATIO: "0.80"
      MR_BOLL_THRESHOLD: "0.70"
  P12:
    note: "clone-C — RR 1.00 / Boll 0.80"
    env:
      RR_RATIO: "1.00"
      MR_BOLL_THRESHOLD: "0.80"
  P13:
    note: "clone-D — RR 1.20 / Boll 0.85"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"

  # ── กลายพันธุ์รอบฐาน B (RR 0.80) ──
  P14:
    note: "B-ATR15 — SL แคบลง เข้าเร็วออกเร็ว"
    env:
      RR_RATIO: "0.80"
      MR_BOLL_THRESHOLD: "0.70"
      ATR_MULTIPLIER: "1.5"
  P15:
    note: "B-ATR25 — SL กว้างขึ้น ทน noise"
    env:
      RR_RATIO: "0.80"
      MR_BOLL_THRESHOLD: "0.70"
      ATR_MULTIPLIER: "2.5"
  P16:
    note: "B-TS24 — ให้เวลาคลี่ตัว 2 ชม. (time stop 24 bars)"
    env:
      RR_RATIO: "0.80"
      MR_BOLL_THRESHOLD: "0.70"
      TIME_STOP_BARS: "24"

  # ── กลายพันธุ์รอบฐาน C (RR 1.00) ──
  P17:
    note: "C-conf50 — เปิดประตูเข้าง่ายขึ้น"
    env:
      RR_RATIO: "1.00"
      MR_BOLL_THRESHOLD: "0.80"
      MIN_CONFIDENCE: "0.50"
      BUY_MIN_CONFIDENCE: "0.50"
  P18:
    note: "C-conf60 — เข้มงวดขึ้น เข้าน้อย-แม่นขึ้น"
    env:
      RR_RATIO: "1.00"
      MR_BOLL_THRESHOLD: "0.80"
      MIN_CONFIDENCE: "0.60"
      BUY_MIN_CONFIDENCE: "0.60"

  # ── กลายพันธุ์รอบฐาน D (RR 1.20) ──
  P19:
    note: "D-ATR15 — RR สูง + SL แคบ (แม่นสุด เสี่ยงสุด)"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"
      ATR_MULTIPLIER: "1.5"
  P20:
    note: "D-no-hours — ถอด entry-hour gate ออก (เทสว่า hour gate มีค่าจริงไหม)"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"
      ENTRY_HOURS: ""
      BLOCKED_HOURS: ""

  # ── รอบ 16/10: สมมติฐาน exit — Marks เจอไม้ชนะโดน time stop 12 bars
  #    หั่นกลางทาง (max_holding 81 ไม้ จบ -86.8$ เฉลี่ย -1.07/ไม้ ขณะที่
  #    TP จบเฉลี่ย +8.17/ไม้, SL แค่ 6 ครั้ง) → ปล่อยไม้วิ่งนานขึ้น/เปิด
  #    trailing TP น่าจะดีกว่า. P20 (baseline ดีสุด: +22.03$ / PF 1.66 /
  #    WR 56%) เป็นฐานทั้งคู่ ──
  P21:
    note: "P20+TS24 — ยืด time stop 12→24 bars (2 ชม.): ไม้ชนะถูกหั่น -1.07/ไม้ ที่ 12 bars ทั้งที่ TP เฉลี่ย +8.17 — ให้เวลาวิ่งถึง TP มากขึ้น"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"
      ENTRY_HOURS: ""
      BLOCKED_HOURS: ""
      TIME_STOP_BARS: "24"
  P22:
    note: "P20+trail — เปิด TRAILING_TP (time stop 12 คงเดิม): ปล่อยกำไรวิ่งต่อหลัง TP zone แทนตายที่ระดับคงที่"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"
      ENTRY_HOURS: ""
      BLOCKED_HOURS: ""
      TRAILING_TP_ENABLED: "1"

  # ── รอบ 24/10 (axis2): P23 = รวม knob ชนะสองสมมติฐาน exit ในตัวเดียว:
  #    P21 ยืด time stop (แก้ไม้ชนะโดนหั่น) + P22 trailing TP (แก้ตายที่ระดับ
  #    คงที่) — ถ้าสองกลไกเสริมกัน P23 ควรดีกว่าทั้งคู่ ถ้าชนกันจะรู้ว่าควรเลือกใคร ──
  P23:
    note: "P21+trail — TS24 และ trailing TP พร้อมกัน: ทดสอบว่าให้เวลาวิ่ง + lock กำไรทั้งคู่เสริมหรือชนกัน"
    env:
      RR_RATIO: "1.20"
      MR_BOLL_THRESHOLD: "0.85"
      ENTRY_HOURS: ""
      BLOCKED_HOURS: ""
      TIME_STOP_BARS: "24"
      TRAILING_TP_ENABLED: "1"

  # ── รอบ 7/11 (gate-round1, คุณหมออนุมัติ): P24 = โคลน P22 ลด RR 1.20→1.00
  #    ตัวแทนทางการ (trailing TP) ของแกน MR ยังไม่เคยลอง RR ต่ำกว่า 1.20 —
  #    วัดว่า MR-trailing ที่ RR 1.00 เข้าบ่อยขึ้นจะดีกว่าไหม (สมมติฐาน
  #    trailing lock กำไรได้ก็พอ ไม่ต้องรอ RR สูง) ──
  P24:
    note: "P22-RR1.0 — โคลน P22 (MR-trailing) แก้เฉพาะ RR 1.20→1.00: trailing ที่ RR ต่ำกว่า เข้าบ่อยขึ้น lock เร็วขึ้น"
    env:
      RR_RATIO: "1.00"
      MR_BOLL_THRESHOLD: "0.85"
      ENTRY_HOURS: ""
      BLOCKED_HOURS: ""
      TRAILING_TP_ENABLED: "1"

  # ── รอบ 24/10 (axis2): แกน trend-following กลุ่ม farm2 —
  #    Marks ออกแบบ 3 ตัววัดมิติที่ farm1 วัดไม่ได้ (ทั้งก้อน MR-only:
  #    ตลาด trending = เงียบพร้อมกัน corr ต่ำสุด 0.61) · TRENDING_HARD_BLOCK=0
  #    เปิด swing path เต็มแบบก่อน mr-bet · กระจายสมมติฐาน exit เดียวกับ
  #    รอบ 16/10 แต่บนกรอบ RR สูงของ trend: baseline / ปล่อยวิ่ง / lock กำไร ──
  P31:
    note: "trend-baseline — RR 2.5 TS48: มาตรฐาน trend ตัวแรก (SL = 2×ATR ตาม common, TP = 2.5R) ไม่ trailing — เกณฑ์เทียบให้ P32/P33"
    env:
      RR_RATIO: "2.5"
      TIME_STOP_BARS: "48"
      TRAILING_TP_ENABLED: "0"
  P32:
    note: "trend-let-run — RR 3.0 TS96 (8 ชม.): ไม้ trend ต้องมีเวลาคลี่ (บทเรียนเดียวกับ P21 แต่สเกล RR สูงกว่า) — วัดว่า trend บน M5 ไปไกลพอให้ RR 3.0 คุ้มไหม"
    env:
      RR_RATIO: "3.0"
      TIME_STOP_BARS: "96"
      TRAILING_TP_ENABLED: "0"
  P33:
    note: "trend-lock — P31 + trailing TP: trend กลับตัวกินกำไรส่วนหลังบ่อย — lock กำไรกลางทางแทน อาจเก็บได้มากกว่า TP คงที่ที่ RR 2.5"
    env:
      RR_RATIO: "2.5"
      TIME_STOP_BARS: "48"
      TRAILING_TP_ENABLED: "1"

  # ── รอบ 7/11 (gate-round1, คุณหมออนุมัติ): 2 ตัวบนแกน trend (farm2)
  #    สมมติฐานจากผลฟาร์มรอบแรก — P31 กำไรทั้งหมดจบทาง max_holding (ไม่ถึง
  #    TP/SL เลย) → P34 ลองจบเร็วขึ้น (TS 48→24) · วาดบันได RR ให้ครบ
  #    1.5/2.5/3.0 (P32 ล้มที่ 3.0) → P35 ลงมาที่ 1.5 ──
  P34:
    note: "P31-TS24 — โคลน P31 แก้เฉพาะ TS 48→24: กำไร P31 จบทาง max_holding ทั้งหมด → ลองจบเร็วขึ้นเผื่อ edge อยู่ที่ช่วงต้น"
    env:
      RR_RATIO: "2.5"
      TIME_STOP_BARS: "24"
      TRAILING_TP_ENABLED: "0"
  P35:
    note: "P31-RR1.5 — โคลน P31 แก้เฉพาะ RR 2.5→1.5: วาดบันได RR 1.5/2.5/3.0 บนแกน trend (P32 ล้มที่ 3.0 — เช็คว่าต่ำกว่า 2.5 ดีกว่าไหม)"
    env:
      RR_RATIO: "1.5"
      TIME_STOP_BARS: "48"
      TRAILING_TP_ENABLED: "0"