    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: mt5p1
    environment:
      # 2026-09-18: pass /password: so MT5 auto-logs-in on a fresh volume —
      # removes the manual VNC login step (VNC canvas is not scriptable without vision).
      # After first successful login MT5 caches credentials in mt5-config-p1.
      - MT5_CMD_OPTIONS=/login:${MT5_LOGIN_P1:-} /password:${MT5_PASSWORD_P1:-} /server:${MT5_SERVER_P1:-Exness-MT5Trial7}
      - CUSTOM_USER=mt5user
      - PASSWORD=mt5password
    ports:
      - "5904:3000"  # VNC web interface
      - "5009:8001"  # RPyC bridge
    volumes:
