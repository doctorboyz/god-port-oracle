  # ── P1-P3 = P22 champion on Exness Standard Cent (คุณหมอสั่งผ่าน Hermes
  #    16/11, stage 1 = orders NOT sent). Supersedes the 2026-09 paper-round
  #    variants (P1-base-ny / P2-tight-sl / P3-more-entry) — those matrices
  #    are retired; contract tests updated in the same commit.
  #    Config mirrors demo C (mr-bet-p22-C) — the official P22 winner clone
  #    (paper PF 1.47 / OOS 1.54 / demo-real-cost PF 1.43).
  #    CENT ACCOUNT UNITS (the danger point of this deploy): the bridge
  #    returns balance/equity in the ACCOUNT currency = USC (1 USD = 100 USC,
  #    P1=5000 / P2=2000 / P3=1000). Sizing is currency-agnostic
  #    (lots = equity×risk / SL_dist×100, PnL also USC) so lots come out
  #    correct (0.01–0.05) — but every baseline the engine compares against
  #    BRIDGE equity must be USC too: INITIAL_EQUITY (in-engine account-level
  #    DD line) and accounts.baseline_balance (PM equity fallback). USD-unit
  #    baselines are 100× off → the 20% account DD layer never fires.
  #    Causal proof: tests/test_p22_cent_deploy_causal.py.
  #    HARD-CODED (no ${VAR:-...}) on every strategy/safety knob: the host
  #    .env holds legacy values (ML_FILTER_ENABLED=1, RR_RATIO_*=3.0 …)
  #    that interpolation lets win — repo lesson (ML_FILTER / RR_RATIO class).
  oracle-engine-p1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-engine-p1
    environment:
      - TRADING_PHASE=${TRADING_PHASE:-both}
      # Stage 2 ARMED (17/11): P1 trades live — kill switch deployed +
      # sizing proven at runtime + คุณหมอ approved. Hard-coded so a stale
      # DRY_RUN_PORTFOLIO in the host .env can never disarm/override.
      # Full ladder live (17/11, คุณหมอ: "P2 and P3 ก็ต้องเทรดจริงด้วยนะ")
      # — see the P2/P3 service blocks, same arming rule.
      - DRY_RUN=0
      - ACCOUNTS=P1
      - DB_PATH=/app/data/oracle_p1.db
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-300}
      - TRADE_INTERVAL=${TRADE_INTERVAL:-300}
      # P22 = MR swing only (mirror demo C): scalp path off
      - SCALP_ENABLED=0
      - M5_SCALP_ENABLED=0
      # MR-only generator mode (mirror oracle-engine-train)
      - TRENDING_HARD_BLOCK=1
      - SESSION_CONFIDENCE_MULT_DISABLED=1
      - REGIME_VOLATILE_SKIP=1
      # NOTE: RANGING_HARD_BLOCK intentionally NOT set (default 0). The old
      # P1 config set =1 which starves MR entries — P22 enters in ranging.
      - H4_USE_CLOSED_BAR_ONLY=1
      # ML veto OFF — mirrors demo C. HARD-CODED: host .env still carries
      # ML_FILTER_ENABLED=1 (legacy) which interpolation would let win.
      - ML_FILTER_ENABLED=0
      - LEARNING_MODE=0
      # ── P22 champion knobs (mirror mr-bet-p22-C) ──
      - STRATEGY_ID_P1=mr-bet-p22-P1
      - ATR_MULTIPLIER_P1=2.0
      - RR_RATIO_P1=1.20
      - MIN_CONFIDENCE_P1=0.55
      - BUY_MIN_CONFIDENCE_P1=0.55
      - MR_BOLL_THRESHOLD_P1=0.85
      - TIME_STOP_BARS_P1=12
      - TRAILING_TP_ENABLED_P1=1
      # trailing activation/trail deliberately NOT overridden → engine
      # defaults 0.20/0.10, exactly what farm P22 and demo C ran with.
      - CIRCUIT_BREAKER_COOLDOWN_MINUTES_P1=1440
      - RISK_PER_TRADE_P1=0.005
      - PARTIAL_TP_ENABLED_P1=0
      - TP1_RATIO_P1=0.5
      - RR_SCALE_IN_P1=2.5
      # Hour gates open (mirror demo C: P22 won with full occupancy)
      - ENTRY_HOURS_P1=
      - BLOCKED_HOURS_P1=
      - SWING_MAX_SPREAD_P1=30
      - MR_COST_MULT_P1=3.0
      - SL_CAP_P1=12.0
      # ── position limits ──
      - MAX_POSITIONS_P1=1
      - MAX_POSITIONS_CAP_P1=1
      - MIN_POSITIONS_P1=1
      # USC (= $50). Provably inert in the swing path while cap=1
      # (min(1, max(1, floor(eq/epp))) == 1 for ANY equity — causal test);
      # kept account-currency-correct for the day the cap is raised.
      - EQUITY_PER_POSITION_P1=5000
      # ── cent baselines (USC — see service header) ──
      - INITIAL_BALANCE_P1=5000
      - INITIAL_EQUITY_P1=5000
      - LEVERAGE_P1=2000
      - ACCOUNT_TYPE_P1=cent_real
      - SIGNAL_GROUP_P1=portfolio
      # In-engine drawdown lines (unchanged policy; now meaningful in USC)
      - DRAWDOWN_DAILY_LIMIT_P1=0.10
      - DRAWDOWN_WEEKLY_LIMIT_P1=0.20
      - DRAWDOWN_ACCOUNT_LIMIT_P1=0.20
      - DRAWDOWN_COOLDOWN_HOURS_P1=4
      # TradeBlocker — mirror demo C (10/30) + lot clamp 0.05 hard-coded:
      # the last line guaranteeing lots can never exceed the approved range
      - TRADE_BLOCKER_DAILY_LIMIT=10
      - TRADE_BLOCKER_WEEKLY_LIMIT=30
      - TRADE_BLOCKER_HARD_MAX_LOTS=0.05
      # MT5 bridge (credentials from VPS .env only — never in repo)
      - MT5_LOGIN_P1=${MT5_LOGIN_P1:-}
      - MT5_PASSWORD_P1=${MT5_PASSWORD_P1:-}
      - MT5_SERVER_P1=Exness-MT5Real25
      # Cent server serves XAUUSDc only — explicit beats alias probing
      - MT5_SYMBOL_P1=XAUUSDc
      - MT5_BRIDGE_P1_HOST=mt5p1
      - MT5_BRIDGE_P1_PORT=8001
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      # 2026-09-20 (doctorboyz): ปิด broadcast โปง (adisorn bot spam) —
      # daily summary 00:00 UTC + bridge status ทุก 4h; trade alerts ยังส่งปกติ.
      - DAILY_SUMMARY_DISABLED=${DAILY_SUMMARY_DISABLED:-1}
      - BRIDGE_STATUS_DISABLED=${BRIDGE_STATUS_DISABLED:-1}
    volumes:
      - ${PORTFOLIO_DATA_DIR:-/opt/god-port/data}/p1:/app/data
    depends_on:
      mt5p1:
        condition: service_healthy
    restart: unless-stopped

