      # Was applied directly on VPS without commit — committed 2026-09-21.
      - DAILY_SUMMARY_DISABLED=${DAILY_SUMMARY_DISABLED:-1}
      - BRIDGE_STATUS_DISABLED=${BRIDGE_STATUS_DISABLED:-1}
      # ═══ Auto-retrain — ปิดบน train (mr-bet 2026-09-21): เก็บสถิติ framework เดียว
      # ให้สะอาด ไม่ mix กับ retrain กลางทาง. Real-A never gets auto-retrain (IRON LAW).
      - AUTO_RETRAIN_ENABLED=${AUTO_RETRAIN_ENABLED:-0}
      - AUTO_RETRAIN_MIN_NEW_OUTCOMES=${AUTO_RETRAIN_MIN_NEW_OUTCOMES:-50}
