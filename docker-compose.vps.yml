  # ═══ Portfolio paper-parallel P1-P3 — Hermes-approved 2026-09-16 ═══════
  # Q2: SEPARATE engine container + MT5 per account (isolation is a
  #     requirement, not a suggestion). Paper round = demo accounts.
  # Q3: ML ensemble OR @0.50 (same as Demo-D) for baseline comparison.
  # Q5 DEPLOY RULE: `docker compose up -d` ONLY the new services below —
  #     NEVER recreate oracle-engine (Real-A) or any existing service.
  #     Verify after deploy: `docker ps` — Real-A start-time unchanged.
  # Data: bind mounts so the host-side crontab (portfolio_manager.py,
  #     every 30 min) reads/writes the same DB files → DB-backed freeze
  #     gate works across engine container restarts.
  # Variants: see scripts/generate_variants.py (sweet-spot basis in DB).

