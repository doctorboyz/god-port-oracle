# MT5 Bridge Containers on x86_64 VPS
# Uses gmag11/MetaTrader5-Docker as base, extended with our custom RPyC bridge
#
# gmag11 provides: Wine + MT5 terminal + Python 3.9 + VNC
# We add: custom RPyC bridge server (mt5_bridge_server.py) + numpy fix
#
# Container names are short: mt5a, mt5b, mt5c, mt5d
# Bridge port 8001 inside container → mapped to 5005/5006/5007/5008 externally
# VNC port 3000 inside container → mapped to 5900/5901/5902/5903 externally
#
# First-time setup:
#   1. docker compose -f docker-compose.vps.yml up -d
#   2. Wait ~3 min for gmag11 initialization
#   3. Login to MT5 via VNC for each account (first time only)
#   4. Bridge auto-starts after container restart
#
# DO NOT use on macOS ARM — Wine crashes under Rosetta emulation

services:
  mt5a:
    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: mt5a
    environment:
      - MT5_CMD_OPTIONS=/login:${MT5_LOGIN_A} /server:${MT5_SERVER_A:-Exness-MT5Trial17}
      - CUSTOM_USER=mt5user
      - PASSWORD=mt5password
    ports:
      - "5900:3000"  # VNC web interface
      - "5005:8001"  # RPyC bridge
    volumes:
      - mt5-config-a:/config
    restart: unless-stopped

  mt5b:
    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: mt5b
    environment:
      - MT5_CMD_OPTIONS=/login:${MT5_LOGIN_B} /server:${MT5_SERVER_B:-Exness-MT5Trial17}
      - CUSTOM_USER=mt5user
      - PASSWORD=mt5password
    ports:
      - "5901:3000"  # VNC web interface
      - "5006:8001"  # RPyC bridge
    volumes:
      - mt5-config-b:/config
    restart: unless-stopped

  mt5c:
    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: mt5c
    environment:
      - MT5_CMD_OPTIONS=/login:${MT5_LOGIN_C} /server:${MT5_SERVER_C:-Exness-MT5Trial7}
      - CUSTOM_USER=mt5user
      - PASSWORD=mt5password
    ports:
      - "5902:3000"  # VNC web interface
      - "5007:8001"  # RPyC bridge
    volumes:
      - mt5-config-c:/config
    restart: unless-stopped

  # ═══ Account D: V6-Demo2 — Demo Pro $500 ════════════════════════════════
  # To activate: set MT5_LOGIN_D, MT5_PASSWORD_D, MT5_SERVER_D in .env
  # and change ACCOUNTS to A,B,C,D
  mt5d:
    build:
      context: ./docker/mt5
      dockerfile: Dockerfile
    container_name: mt5d
    environment:
      - MT5_CMD_OPTIONS=/login:${MT5_LOGIN_D:-} /server:${MT5_SERVER_D:-Exness-MT5Trial7}
      - CUSTOM_USER=mt5user
      - PASSWORD=mt5password
    ports:
      - "5903:3000"  # VNC web interface
      - "5008:8001"  # RPyC bridge
    volumes:
      - mt5-config-d:/config
    restart: unless-stopped

  # ═══ Oracle Engine for Real-A only — V4 model, production quality ═══
  # B/C/D moved to oracle-engine-train (V12 mixed model)
  oracle-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-engine
    environment:
      - TRADING_PHASE=${TRADING_PHASE:-both}
      - DRY_RUN=${DRY_RUN:-1}
      - ACCOUNTS=A
      - DB_PATH=/app/data/oracle.db
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-300}
      - TRADE_INTERVAL=${TRADE_INTERVAL:-300}
      - SCALP_ENABLED=${SCALP_ENABLED:-0}
      - M5_SCALP_ENABLED=${M5_SCALP_ENABLED:-1}
      - M5_SCALP_INTERVAL=${M5_SCALP_INTERVAL:-300}
      - M5_SCALP_SPREAD_MAX=${M5_SCALP_SPREAD_MAX:-30}
      - M5_SCALP_RISK_PER_TRADE=${M5_SCALP_RISK_PER_TRADE:-0.015}
      - ML_FILTER_ENABLED=${ML_FILTER_ENABLED_A:-1}
      - ML_LOSS_THRESHOLD=${ML_LOSS_THRESHOLD:-0.55}
      - ML_MODEL_DIR_A=${ML_MODEL_DIR_A:-/app/data/models/trade_outcome_v4}
      - ML_MODEL_DIR=${ML_MODEL_DIR_A:-/app/data/models/trade_outcome_v4}
      - SWING_DISABLED_ACCOUNTS=${SWING_DISABLED_ACCOUNTS:-}
      - MAX_POSITIONS_A=${MAX_POSITIONS_A:-5}
      - EQUITY_PER_POSITION_A=${EQUITY_PER_POSITION_A:-200}
      - MAX_POSITIONS_CAP_A=${MAX_POSITIONS_CAP_A:-5}
      # Fix 1 (2026-07-09): min positions floor = 2 for Real-A so equity dip
      # doesn't collapse max_positions to 1 and block all new entries.
      # Formula: min(cap, max(min_positions, floor(equity/per_pos)))
      - MIN_POSITIONS_A=${MIN_POSITIONS_A:-2}
      # Fix 3 (2026-07-09): ranging hard-block per CLAUDE.md "Ranging = พัก".
      # When regime=ranging and not learning_mode, generator returns HOLD.
      # Real-A only — B/C/D (oracle-engine-train) leave unset to collect ML data.
      - RANGING_HARD_BLOCK=${RANGING_HARD_BLOCK:-1}
      - LEARNING_MODE=0
      - ATR_MULTIPLIER_A=${ATR_MULTIPLIER_A:-2.0}
      - RR_RATIO_A=${RR_RATIO_A:-2.5}
      - MIN_CONFIDENCE_A=${MIN_CONFIDENCE_A:-0.45}
      - BUY_MIN_CONFIDENCE_A=${BUY_MIN_CONFIDENCE_A:-0.45}
      - M5_MAX_SPREAD_A=${M5_MAX_SPREAD_A:-45}
      - PARTIAL_TP_ENABLED_A=${PARTIAL_TP_ENABLED_A:-0}
      - TP1_RATIO_A=${TP1_RATIO_A:-0.5}
      - RR_SCALE_IN_A=${RR_SCALE_IN_A:-2.5}
      # Fix #1 (2026-07-12): widen trailing TP for Real-A — defaults 0.20/0.10
      # choke winners before 2.5R TP (win:loss 0.82:1 vs design 2.5:1).
      # arm 0.40% = trail arms after ~$16 MFE (was $8).
      # trail 0.20% = exit on $8 pullback from peak (was $4) — survives normal noise.
      # B/C/D keep defaults (0.20/0.10) — only Real-A widened for observation.
      - TRAILING_ACTIVATION_PCT_A=${TRAILING_ACTIVATION_PCT_A:-0.40}
      - TRAILING_TRAIL_PCT_A=${TRAILING_TRAIL_PCT_A:-0.20}
      # Fix #2 (2026-07-12): H4 trend from CLOSED H4 bar only — resampler's
      # last bin is the in-progress H4 bar; EMA10/50 on its close flipped
      # 19+ times in 8h on Real-A (07-10) and green-lit 2 counter-trend
      # SELLs that hit SL. =1 drops the incomplete bar; =0 keeps legacy.
      - H4_USE_CLOSED_BAR_ONLY=${H4_USE_CLOSED_BAR_ONLY:-1}
      # Fix #3 (2026-07-12): ATR multiplier 1.5 → 2.0 — SL was tightest of all
      # accounts (B=2.0, C/D=2.5, forward-engine BEST=2.0). 1.5× on XAUUSD M5
      # puts SL within normal noise range → stopped on pullbacks even when
      # direction is right. 2.0 matches B + proven forward config; risk per
      # trade preserved (position sizing lowers lots to keep $ risk constant).
      - INITIAL_BALANCE_A=${INITIAL_BALANCE_A:-500}
      - INITIAL_EQUITY_A=${INITIAL_EQUITY_A:-500}
      - ACCOUNT_TYPE_A=${ACCOUNT_TYPE_A:-real}
      # Kill switch (user-approved 2026-07-01): ขาดวัน > 5% / ขาดสัปดาห์ > 10% / MaxDD 20% from peak
      - DRAWDOWN_DAILY_LIMIT_A=${DRAWDOWN_DAILY_LIMIT_A:-0.05}
      - DRAWDOWN_WEEKLY_LIMIT_A=${DRAWDOWN_WEEKLY_LIMIT_A:-0.10}
      - DRAWDOWN_ACCOUNT_LIMIT_A=${DRAWDOWN_ACCOUNT_LIMIT_A:-0.20}
      - DRAWDOWN_COOLDOWN_HOURS_A=${DRAWDOWN_COOLDOWN_HOURS_A:-4}
      # ISSUE C3: never allow LEARNING_MODE on Real-A — guard in live_trader __init__
      - LEARNING_MODE=0
      # TradeBlocker config (gap-filler gate, ISSUE C1)
      - TRADE_BLOCKER_DAILY_LIMIT=${TRADE_BLOCKER_DAILY_LIMIT:-20}
      - TRADE_BLOCKER_WEEKLY_LIMIT=${TRADE_BLOCKER_WEEKLY_LIMIT:-80}
      - TRADE_BLOCKER_HARD_MAX_LOTS=${TRADE_BLOCKER_HARD_MAX_LOTS:-0.50}
      - TRADE_BLOCKER_MARGIN_SAFETY=${TRADE_BLOCKER_MARGIN_SAFETY:-0.80}
      # ═══ MT5 Bridge credentials (A only) ════════════════════════════════
      - MT5_LOGIN_A=${MT5_LOGIN_A:-}
      - MT5_PASSWORD_A=${MT5_PASSWORD_A:-}
      - MT5_SERVER_A=${MT5_SERVER_A:-Exness-MT5Trial17}
      - MT5_BRIDGE_A_HOST=mt5a
      - MT5_BRIDGE_A_PORT=8001
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      # 2026-09-20 (doctorboyz): ปิด broadcast โปง (adisorn bot spam) —
      # daily summary 00:00 UTC + bridge status ทุก 4h; trade alerts ยังส่งปกติ.
      # Was applied directly on VPS without commit — committed 2026-09-21.
      - DAILY_SUMMARY_DISABLED=${DAILY_SUMMARY_DISABLED:-1}
      - BRIDGE_STATUS_DISABLED=${BRIDGE_STATUS_DISABLED:-1}
    volumes:
      - oracle-data:/app/data
    depends_on:
      mt5a:
        condition: service_healthy
    restart: unless-stopped

  # ═══ Oracle Engine for B/C/D — V4 model (separate from Real-A) ═══
  # Real-A uses oracle-engine (V4), B/C/D use oracle-engine-train (V4)
  # mixed_v12 was broken (feature_engineer.joblib referenced bxau module not
  # installed in production → silent ML filter disable). Reverted B/C/D to V4
  # (proven PF=1.71 @ threshold 0.65) while V11 SELL + V12 BUY are retrained
  # without bxau dependency. See learning 2026-06-28_mixed-v12-bxau-broken.md.
  # This separation ensures V12 code changes don't affect Real-A.
  oracle-engine-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-engine-train
    environment:
      - TRADING_PHASE=${TRADING_PHASE:-both}
      - DRY_RUN=${DRY_RUN:-1}
      - ACCOUNTS=B,C,D
      - DB_PATH=/app/data/oracle_train.db
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-300}
      - TRADE_INTERVAL=${TRADE_INTERVAL:-300}
      - SCALP_ENABLED=${SCALP_ENABLED:-0}
      # 2026-09-21 mr-bet: m5-scalp ปิดถาวรบน train (คุณหมอ: ล้างแนวเทรดเก่า) —
      # B/C/D เหลือ swing trader เป็นพาหนะของสัญญาณ MR เท่านั้น
      - M5_SCALP_ENABLED=${M5_SCALP_ENABLED:-0}
      # 2026-09-21 mr-bet: ML ensemble veto ปิด (คุณหมออนุมัติ) — เก็บสถิติ MR สะอาด
      # IRON LAW still holds — A lives in oracle-engine, never gets ensemble.
      # HARD-CODED (ไม่ใช่ ${ML_FILTER_ENABLED:-0}) เพราะ host .env มี ML_FILTER_ENABLED=1
      # (legacy) ซึ่ง interpolation จะให้ค่านั้นชนะ default — deploy 2026-09-21 เจอจริง
      # ตรวจพบ ML_FILTER_ENABLED=1 ใน container train ทั้งที่ตั้งใจ 0
      - ML_FILTER_ENABLED=0
      - ML_LOSS_THRESHOLD=${ML_LOSS_THRESHOLD:-0.55}
      # ML ensemble env ทั้งหมดถูกลบออก 2026-09-21 (mr-bet: ปิด ML veto ตามคุณหมออนุมัติ)
      # Rollback: ดู git history ก่อน commit "chore: mr-bet env" — ML_ENSEMBLE_MODE_*
      # / ML_ENSEMBLE_MODEL_DIRS / ML_ENSEMBLE_THRESH* อยู่ที่นั่น
      - SWING_DISABLED_ACCOUNTS=${SWING_DISABLED_ACCOUNTS:-}
      - MAX_POSITIONS_PER_ACCOUNT=${MAX_POSITIONS_PER_ACCOUNT:-5}
      # 2026-09-18 bet strategy: max_positions=1 ทุกใบ (proposal §4 กติการ่วม)
      - MAX_POSITIONS_B=${MAX_POSITIONS_B:-1}
      - MAX_POSITIONS_C=${MAX_POSITIONS_C:-1}
      - MAX_POSITIONS_D=${MAX_POSITIONS_D:-1}
      - EQUITY_PER_POSITION_B=${EQUITY_PER_POSITION_B:-200}
      - EQUITY_PER_POSITION_C=${EQUITY_PER_POSITION_C:-200}
      - EQUITY_PER_POSITION_D=${EQUITY_PER_POSITION_D:-200}
      - MAX_POSITIONS_CAP_B=${MAX_POSITIONS_CAP_B:-1}
      - MAX_POSITIONS_CAP_C=${MAX_POSITIONS_CAP_C:-1}
      - MAX_POSITIONS_CAP_D=${MAX_POSITIONS_CAP_D:-1}
      - LEARNING_MODE=0
      # ═══ 2026-09-21 mr-bet framework: high-WR mean reversion on B/C/D (คุณหมอ:
      # รื้อ framework เดิม มาทดสอบ bet-style 3 variant บน demo, ล้างแนวเทรดเก่า) ═══
      # Generator: MR-only mode — ADX>=20 → HOLD, เข้าเฉพาะ Bollinger extreme ใน ranging
      - TRENDING_HARD_BLOCK=${TRENDING_HARD_BLOCK:-1}
      # Session multiplier ปิด — MR conf cap 0.65 x ASIAN 0.70 = 0.455 ต่ำกว่า 0.55
      # เข้าไม่ได้เลยใน golden hours UTC 0/1/6
      - SESSION_CONFIDENCE_MULT_DISABLED=${SESSION_CONFIDENCE_MULT_DISABLED:-1}
      # Volatile regime skip เปิด (bug UnboundLocalError แก้แล้ว 2026-09-21)
      - REGIME_VOLATILE_SKIP=${REGIME_VOLATILE_SKIP:-1}
      # ป้ายสถิติใหม่ แยกจากแถว swing-* เก่าใน oracle_train.db ทันที
      - STRATEGY_ID_B=${STRATEGY_ID_B:-mr-bet-B}
      - STRATEGY_ID_C=${STRATEGY_ID_C:-mr-bet-C}
      - STRATEGY_ID_D=${STRATEGY_ID_D:-mr-bet-D}
      # กติการ่วม: ATR 2.0 / risk 0.5% / conf 0.55 / spread<=30pts / TP>=3x cost /
      # SL<=$12 / time stop 1h (12 bars M5) / trailing+partial TP ปิด / แพ้ 3 ติด พัก 24h
      - ATR_MULTIPLIER_B=${ATR_MULTIPLIER_B:-2.0}
      - ATR_MULTIPLIER_C=${ATR_MULTIPLIER_C:-2.0}
      - ATR_MULTIPLIER_D=${ATR_MULTIPLIER_D:-2.0}
      # RR variants: B ปานกลาง 0.8 / C 1.0 / D แม่นสุด 1.2 (low-RR high-WR bet style)
      - RR_RATIO_B=${RR_RATIO_B:-0.8}
      - RR_RATIO_C=${RR_RATIO_C:-1.0}
      - RR_RATIO_D=${RR_RATIO_D:-1.2}
      - MIN_CONFIDENCE_B=${MIN_CONFIDENCE_B:-0.55}
      - MIN_CONFIDENCE_C=${MIN_CONFIDENCE_C:-0.55}
      - MIN_CONFIDENCE_D=${MIN_CONFIDENCE_D:-0.55}
      - BUY_MIN_CONFIDENCE_B=${BUY_MIN_CONFIDENCE_B:-0.55}
      - BUY_MIN_CONFIDENCE_C=${BUY_MIN_CONFIDENCE_C:-0.55}
      - BUY_MIN_CONFIDENCE_D=${BUY_MIN_CONFIDENCE_D:-0.55}
      # Bollinger threshold variants: B 0.70 / C 0.80 / D 0.85 (ยิ่งสูงยิ่งเข้าน้อย-แม่น)
      - MR_BOLL_THRESHOLD_B=${MR_BOLL_THRESHOLD_B:-0.70}
      - MR_BOLL_THRESHOLD_C=${MR_BOLL_THRESHOLD_C:-0.80}
      - MR_BOLL_THRESHOLD_D=${MR_BOLL_THRESHOLD_D:-0.85}
      # Swing-path spread gate (pts, XAUUSD 30pts = $0.30)
      - SWING_MAX_SPREAD_B=${SWING_MAX_SPREAD_B:-30}
      - SWING_MAX_SPREAD_C=${SWING_MAX_SPREAD_C:-30}
      - SWING_MAX_SPREAD_D=${SWING_MAX_SPREAD_D:-30}
      # Cost gate: TP ต้อง >= 3x spread · SL cap $12 (เกิน skip ไม่หด)
      - MR_COST_MULT_B=${MR_COST_MULT_B:-3.0}
      - MR_COST_MULT_C=${MR_COST_MULT_C:-3.0}
      - MR_COST_MULT_D=${MR_COST_MULT_D:-3.0}
      - SL_CAP_B=${SL_CAP_B:-12.0}
      - SL_CAP_C=${SL_CAP_C:-12.0}
      - SL_CAP_D=${SL_CAP_D:-12.0}
      # Exit: TP ตายตัว + time stop 1h — MR คลี่ตัวเร็ว ค้างเกิน 1h = thesis ตาย
      - TIME_STOP_BARS_B=${TIME_STOP_BARS_B:-12}
      - TIME_STOP_BARS_C=${TIME_STOP_BARS_C:-12}
      - TIME_STOP_BARS_D=${TIME_STOP_BARS_D:-12}
      - TRAILING_TP_ENABLED_B=${TRAILING_TP_ENABLED_B:-0}
      - TRAILING_TP_ENABLED_C=${TRAILING_TP_ENABLED_C:-0}
      - TRAILING_TP_ENABLED_D=${TRAILING_TP_ENABLED_D:-0}
      # 3-loss streak → พัก 24h (CB cooldown 1440 min)
      - CIRCUIT_BREAKER_COOLDOWN_MINUTES_B=${CIRCUIT_BREAKER_COOLDOWN_MINUTES_B:-1440}
      - CIRCUIT_BREAKER_COOLDOWN_MINUTES_C=${CIRCUIT_BREAKER_COOLDOWN_MINUTES_C:-1440}
      - CIRCUIT_BREAKER_COOLDOWN_MINUTES_D=${CIRCUIT_BREAKER_COOLDOWN_MINUTES_D:-1440}
      # 2026-09-18 bet strategy variant mapping — superseded 2026-09-21 by
      # mr-bet (MR-only mean reversion, ตารางข้างบน). เก็บไว้อ้างอิง rollback.
      # Entry-hour windows (UTC) — golden hours จาก sweet-spot 2,154 trades
      # blocked 10-12,16,21 BKK = 3,4,5,9,14 UTC (negative-EV)
      - ENTRY_HOURS_B=${ENTRY_HOURS_B:-6,8,18,19,20}
      - BLOCKED_HOURS_B=${BLOCKED_HOURS_B:-3,4,5,9,14}
      - ENTRY_HOURS_C=${ENTRY_HOURS_C:-0,1,6,8}
      - BLOCKED_HOURS_C=${BLOCKED_HOURS_C:-3,4,5,9,14}
      - ENTRY_HOURS_D=${ENTRY_HOURS_D:-0,1,18,19,20}
      - BLOCKED_HOURS_D=${BLOCKED_HOURS_D:-3,4,5,9,14}
      # Risk per trade: 0.5% flat ทุกใบ (mr-bet 2026-09-21 — D ลดจาก 1.0%)
      - RISK_PER_TRADE_B=${RISK_PER_TRADE_B:-0.005}
      - RISK_PER_TRADE_C=${RISK_PER_TRADE_C:-0.005}
      # partial TP ปิดทุกใบ — สถิติ exit สะอาด (TP คือ TP)
      - PARTIAL_TP_ENABLED_B=${PARTIAL_TP_ENABLED_B:-0}
      - PARTIAL_TP_ENABLED_C=${PARTIAL_TP_ENABLED_C:-0}
      - PARTIAL_TP_ENABLED_D=${PARTIAL_TP_ENABLED_D:-0}
      - TP1_RATIO_B=${TP1_RATIO_B:-0.5}
      - TP1_RATIO_C=${TP1_RATIO_C:-0.5}
      - TP1_RATIO_D=${TP1_RATIO_D:-0.5}
      - RR_SCALE_IN_B=${RR_SCALE_IN_B:-2.5}
      - RR_SCALE_IN_C=${RR_SCALE_IN_C:-2.5}
      - RR_SCALE_IN_D=${RR_SCALE_IN_D:-2.5}
      - INITIAL_BALANCE_B=${INITIAL_BALANCE_B:-100}
      - INITIAL_EQUITY_B=${INITIAL_EQUITY_B:-100}
      - INITIAL_BALANCE_C=${INITIAL_BALANCE_C:-1000}
      - INITIAL_EQUITY_C=${INITIAL_EQUITY_C:-1000}
      - INITIAL_BALANCE_D=${INITIAL_BALANCE_D:-100}
      # mr-bet 2026-09-23 (คุณหมออนุมัติ): รีเซ็ตฐาน drawdown ของ D จาก 500 (ยุคเก่า
      # ใน host .env ทำให้ equity $355.67 ติดเส้น 15% = $425 และถูกบล็อกถาวร
      # ตั้งแต่เริ่ม mr-bet) เป็น equity จริง ณ วันที่รีเซ็ต — HARD-CODED (ไม่ใช่
      # ${INITIAL_EQUITY_D:-...}) เพราะ host .env มี INITIAL_EQUITY_D=500 ซึ่งจะชนะ
      # ค่า default เสมอ (บทเรียนเดียวกับ ML_FILTER_ENABLED)
      - INITIAL_EQUITY_D=355.67
      - LEVERAGE_D=${LEVERAGE_D:-500}
      - ACCOUNT_TYPE_B=${ACCOUNT_TYPE_B:-demo}
      - ACCOUNT_TYPE_C=${ACCOUNT_TYPE_C:-demo}
      - ACCOUNT_TYPE_D=${ACCOUNT_TYPE_D:-demo}
      - DRAWDOWN_DAILY_LIMIT_B=${DRAWDOWN_DAILY_LIMIT_B:-0.10}
      - DRAWDOWN_WEEKLY_LIMIT_B=${DRAWDOWN_WEEKLY_LIMIT_B:-0.20}
      - DRAWDOWN_ACCOUNT_LIMIT_B=${DRAWDOWN_ACCOUNT_LIMIT_B:-0.50}
      - DRAWDOWN_COOLDOWN_HOURS_B=${DRAWDOWN_COOLDOWN_HOURS_B:-2}
      - DRAWDOWN_DAILY_LIMIT_C=${DRAWDOWN_DAILY_LIMIT_C:-0.10}
      - DRAWDOWN_WEEKLY_LIMIT_C=${DRAWDOWN_WEEKLY_LIMIT_C:-0.20}
      - DRAWDOWN_ACCOUNT_LIMIT_C=${DRAWDOWN_ACCOUNT_LIMIT_C:-0.50}
      - DRAWDOWN_COOLDOWN_HOURS_C=${DRAWDOWN_COOLDOWN_HOURS_C:-2}
      # Demo-D slow-but-sure drawdown (2026-08-23): tight 3/6/15% — kill loss fast
      # Real-A uses 5/10/20%; D tighter because slow-but-sure = capital preservation first
      - DRAWDOWN_DAILY_LIMIT_D=${DRAWDOWN_DAILY_LIMIT_D:-0.03}
      - DRAWDOWN_WEEKLY_LIMIT_D=${DRAWDOWN_WEEKLY_LIMIT_D:-0.06}
      - DRAWDOWN_ACCOUNT_LIMIT_D=${DRAWDOWN_ACCOUNT_LIMIT_D:-0.15}
      - DRAWDOWN_COOLDOWN_HOURS_D=${DRAWDOWN_COOLDOWN_HOURS_D:-4}
      # Demo-D slow-but-sure extras (2026-08-23): single position, slow blocker
      # mr-bet 2026-09-21: risk ลดเหลือ 0.5% flat เท่า B/C
      - RISK_PER_TRADE_D=${RISK_PER_TRADE_D:-0.005}
      - MIN_POSITIONS_D=${MIN_POSITIONS_D:-1}
      - TRADE_BLOCKER_DAILY_LIMIT=${TRADE_BLOCKER_DAILY_LIMIT:-10}
      - TRADE_BLOCKER_WEEKLY_LIMIT=${TRADE_BLOCKER_WEEKLY_LIMIT:-30}
      - TRADE_BLOCKER_HARD_MAX_LOTS=${TRADE_BLOCKER_HARD_MAX_LOTS:-0.05}
      # ═══ MT5 Bridge credentials (B, C, D only — no A) ══════════════
      - MT5_LOGIN_B=${MT5_LOGIN_B:-}
